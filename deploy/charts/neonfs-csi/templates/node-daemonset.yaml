apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "neonfs-csi.nodeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neonfs-csi.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "neonfs-csi.nodeSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "neonfs-csi.commonLabels" . | nindent 8 }}
        {{- include "neonfs-csi.nodeSelectorLabels" . | nindent 8 }}
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "neonfs-csi.nodeServiceAccount" . }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.node.priorityClassName }}
      priorityClassName: {{ .Values.node.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "neonfs-csi.provisionInitContainer" . | nindent 8 }}
      containers:
        - name: node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          imagePullPolicy: {{ .Values.sidecars.nodeDriverRegistrar.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ printf "%s/plugins/%s/csi.sock" .Values.node.kubeletDir .Values.driverName }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          imagePullPolicy: {{ .Values.sidecars.livenessProbe.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --health-port={{ .Values.node.livenessProbe.healthPort }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
        - name: neonfs-csi
          image: {{ include "neonfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NEONFS_CSI_MODE
              value: node
            - name: NEONFS_CORE_NODE
              value: {{ .Values.coreNode | quote }}
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEONFS_DIST_PORT
              value: {{ required "node.distPort is required: the controller cannot dial a node plugin whose distribution port nothing published, so volumeMode: Block attach fails. Pick a free host port distinct from controller.distPort (the rig uses 9102)." .Values.node.distPort | quote }}
            {{- with .Values.node.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.node.livenessProbe.healthPort }}
              name: healthz
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.node.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ printf "%s/pods" .Values.node.kubeletDir }}
              mountPropagation: Bidirectional
            # The plugin mounts in its own pod, and NodeStageVolume's
            # globalmount path lives here rather than under `pods`, so the
            # mount has to propagate back to the host from this directory.
            - name: csi-staging-dir
              mountPath: {{ printf "%s/plugins/kubernetes.io/csi" .Values.node.kubeletDir }}
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse
            {{- if .Values.node.hostDevices.enabled }}
            - name: host-devices
              mountPath: {{ .Values.node.hostDevices.path }}
            {{- end }}
            {{- include "neonfs-csi.stateVolumeMounts" . | nindent 12 }}
            {{- with .Values.node.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: registration-dir
          hostPath:
            path: {{ printf "%s/plugins_registry/" .Values.node.kubeletDir }}
            type: Directory
        - name: plugin-dir
          hostPath:
            path: {{ printf "%s/plugins/%s/" .Values.node.kubeletDir .Values.driverName }}
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: {{ printf "%s/pods" .Values.node.kubeletDir }}
            type: Directory
        - name: csi-staging-dir
          hostPath:
            path: {{ printf "%s/plugins/kubernetes.io/csi" .Values.node.kubeletDir }}
            type: DirectoryOrCreate
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- if .Values.node.hostDevices.enabled }}
        # A directory, not a device: block staging picks a free `/dev/nbdX` by
        # scanning, so it cannot name the device it will use in advance.
        - name: host-devices
          hostPath:
            path: {{ .Values.node.hostDevices.path }}
            type: Directory
        {{- end }}
        {{- include "neonfs-csi.stateVolumes" . | nindent 8 }}
        {{- with .Values.node.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
