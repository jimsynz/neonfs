# Default values for neonfs-csi.
# Override with `helm install ... -f my-values.yaml`.

# CSI driver name advertised to the kubelet.
driverName: neonfs.csi.harton.dev

# NeonFS CSI plugin image. Released via the same pipeline as the other
# interface containers; published to ghcr.io and the project's Forgejo
# registry on every tag.
image:
  repository: ghcr.io/jimsynz/neonfs/csi
  tag: ""           # empty → falls back to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Sidecar images. Pinned to upstream Kubernetes-CSI sidecar versions
# known to support CSI v1.10 + VOLUME_CONDITION (#316).
sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    pullPolicy: IfNotPresent
    extraArgs: []
  # Watches VolumeAttachment objects and calls ControllerPublishVolume.
  # Required whenever `csiDriver.attachRequired` is true: without it
  # Kubernetes creates attachments nothing ever acts on, and every pod
  # using a NeonFS volume waits forever.
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.9.0
    pullPolicy: IfNotPresent
    extraArgs: []
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
    pullPolicy: IfNotPresent
    extraArgs: []
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
    pullPolicy: IfNotPresent
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    pullPolicy: IfNotPresent

# Bootstrap token used by the plugin to join the NeonFS cluster.
# `existingSecret` takes precedence; otherwise the chart creates a Secret
# from `value` (operators should override at install time, not commit
# the value).
bootstrap:
  existingSecret: ""
  secretKey: token
  value: ""

# Controller plugin (Deployment).
controller:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector: {}
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  socketPath: /var/lib/csi/sockets/pluginproxy/csi.sock
  livenessProbe:
    healthPort: 29652
  hostNetwork: false
  # Extra environment, volumes and mounts for the plugin container. The
  # driver reaches a NeonFS cluster over Erlang distribution, so a deployment
  # whose cluster is not itself in Kubernetes needs to say where it is
  # (`NEONFS_CORE_NODE`), which port this process listens on
  # (`NEONFS_DIST_PORT` — one per process, so co-located pods must differ),
  # and where its TLS material comes from. None of that is derivable from the
  # chart, so it is passed in rather than guessed at.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Container security context for the plugin. The image runs as `nobody`,
  # which is right for a controller that only talks gRPC — but a deployment
  # that mounts cluster TLS material in from a host has to run as a uid that
  # can read the private key, and only the operator knows which that is.
  securityContext: {}

# Node plugin (DaemonSet).
node:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  kubeletDir: /var/lib/kubelet
  socketPath: /var/lib/kubelet/plugins/neonfs.csi.harton.dev/csi.sock
  registrationSocketPath: /var/lib/kubelet/plugins_registry/neonfs.csi.harton.dev-reg.sock
  livenessProbe:
    healthPort: 29653
  # `priorityClassName: system-node-critical` keeps the Node plugin
  # alive during evictions; override to "" if your cluster doesn't
  # honour it.
  priorityClassName: system-node-critical
  # As `controller.extraEnv` / `extraVolumes` / `extraVolumeMounts`. The node
  # plugin is already `hostNetwork: true`, so its `NEONFS_DIST_PORT` must
  # differ from anything else on the host.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# `CSIDriver` object characteristics. Refer to
# https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
# for semantics.
csiDriver:
  # Block volumes are attached through the controller so a second node
  # cannot take a device the first still holds — the exclusion is a
  # cluster-side claim rather than the CO's bookkeeping alone. Turning this
  # off skips ControllerPublishVolume entirely, and with it that guarantee.
  attachRequired: true
  podInfoOnMount: true
  # `Persistent` is the right answer for filesystem volumes;
  # `Ephemeral` would mean kubelet creates and tears them down inline
  # — not the NeonFS model.
  volumeLifecycleModes:
    - Persistent
  fsGroupPolicy: File
  storageCapacity: false
  seLinuxMount: false

# StorageClass installed alongside the chart. Set
# `storageClass.create: false` to manage StorageClass objects out of
# band.
storageClass:
  create: true
  name: neonfs
  isDefault: false
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    replication_factor: "3"
    tier: hot
  mountOptions: []

# RBAC.
rbac:
  create: true

serviceAccount:
  create: true
  controllerName: ""
  nodeName: ""
  annotations: {}
