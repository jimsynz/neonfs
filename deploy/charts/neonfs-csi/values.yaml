# Default values for neonfs-csi.
# Override with `helm install ... -f my-values.yaml`.

# CSI driver name advertised to the kubelet.
driverName: neonfs.csi.harton.dev

# NeonFS CSI plugin image. Released via the same pipeline as the other
# interface containers; published to ghcr.io and the project's Forgejo
# registry on every tag.
image:
  repository: ghcr.io/jimsynz/neonfs/csi
  tag: ""           # empty → falls back to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Sidecar images. Pinned to upstream Kubernetes-CSI sidecar versions
# known to support CSI v1.10 + VOLUME_CONDITION (#316).
sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    pullPolicy: IfNotPresent
    extraArgs: []
  # Watches VolumeAttachment objects and calls ControllerPublishVolume.
  # Required whenever `csiDriver.attachRequired` is true: without it
  # Kubernetes creates attachments nothing ever acts on, and every pod
  # using a NeonFS volume waits forever.
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.9.0
    pullPolicy: IfNotPresent
    extraArgs: []
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
    pullPolicy: IfNotPresent
    extraArgs: []
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
    pullPolicy: IfNotPresent
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    pullPolicy: IfNotPresent

# The core node the plugin talks to, as an Erlang node name — e.g.
# `neonfs_core@10.0.0.1`. Required. Becomes `NEONFS_CORE_NODE`, which the
# release maps to `:neonfs_client, :bootstrap_nodes`; without it every pod looks
# for core on itself.
coreNode: ""

# Where a cluster member answers invite redemptions, as `host:port` — a
# different thing from `coreNode`, which is why it is a separate value: this one
# is an HTTP endpoint the init container POSTs a CSR to, not a node name.
#
# Defaults to `coreNode`'s host with port 9568, which is right whenever core's
# API is on its default port. Set it when core listens elsewhere, or when
# redemption should go to a different member than the plugin dials.
joinVia: ""

# Host directory holding this node's NeonFS identity. The init container
# populates it; the plugin containers mount `tls/` and `meta/` from it
# read-only. Shared by every NeonFS pod on the host, which is the point —
# identity is per node, not per pod.
stateDir: /var/lib/neonfs

# The invite an init container redeems for this host's cluster certificate.
# `existingSecret` takes precedence; otherwise the chart creates a Secret from
# `value` (override at install time, do not commit it).
#
# `uses` is the invite's redemption budget and is required alongside `value`,
# because one redemption is spent per *node* rather than per pod and the chart
# cannot know the node count. Size it against the nodes that will run NeonFS
# workloads, and mint with `neonfs cluster create-invite --uses N`. There is no
# automatic top-up: a cluster that outgrows the budget needs a new invite.
bootstrap:
  existingSecret: ""
  secretKey: token
  uses: 0
  value: ""

# Controller plugin (Deployment).
controller:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector: {}
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  socketPath: /var/lib/csi/sockets/pluginproxy/csi.sock
  livenessProbe:
    healthPort: 29652
  # The plugin joins the cluster over Erlang distribution from the host's
  # network namespace, using the identity the init container established for
  # that host. Two replicas therefore share one distribution port per host,
  # which `podAntiAffinity` below keeps them off each other for.
  hostNetwork: true
  # Required rather than preferred: two replicas co-located on one host would
  # contend for the same distribution port and the second would never connect.
  # The cost is explicit — on a single-node cluster the second replica stays
  # `Pending` forever. Set `controller.replicaCount: 1` there.
  podAntiAffinity: true
  # Extra environment, volumes and mounts for the plugin container. The
  # driver reaches a NeonFS cluster over Erlang distribution, so a deployment
  # whose cluster is not itself in Kubernetes needs to say where it is
  # (`NEONFS_CORE_NODE`), which port this process listens on
  # (`NEONFS_DIST_PORT` — one per process, so co-located pods must differ),
  # and where its TLS material comes from. None of that is derivable from the
  # chart, so it is passed in rather than guessed at.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Container security context for the plugin. The image runs as `nobody`,
  # which is right for a controller that only talks gRPC — but a deployment
  # that mounts cluster TLS material in from a host has to run as a uid that
  # can read the private key, and only the operator knows which that is.
  securityContext: {}

# Node plugin (DaemonSet).
node:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  kubeletDir: /var/lib/kubelet
  socketPath: /var/lib/kubelet/plugins/neonfs.csi.harton.dev/csi.sock
  registrationSocketPath: /var/lib/kubelet/plugins_registry/neonfs.csi.harton.dev-reg.sock
  livenessProbe:
    healthPort: 29653
  # `priorityClassName: system-node-critical` keeps the Node plugin
  # alive during evictions; override to "" if your cluster doesn't
  # honour it.
  priorityClassName: system-node-critical
  # Host device access for `volumeMode: Block` PVCs.
  #
  # Block staging attaches the volume with `nbd-client`, which needs a free
  # `/dev/nbdX` — and the plugin finds one by scanning `/dev/nbd0..15`, so it
  # needs the directory rather than a named device. `/dev/fuse` is mounted
  # unconditionally as a single `CharDevice` because the mount path needs
  # exactly that one; block cannot name its device in advance.
  #
  # Off by default: a mount-only deployment does not need `/dev`, and this is
  # the widest thing the chart grants. The container is already privileged, so
  # this is not the privilege boundary — it is the visibility one.
  #
  # The host must also have a loadable `nbd` kernel module. The module and
  # `/lib/modules` belong to the host and the chart cannot supply them; a node
  # without it will fail block staging at `nbd-client`, not at scheduling.
  hostDevices:
    enabled: false
    path: /dev
  # As `controller.extraEnv` / `extraVolumes` / `extraVolumeMounts`. The node
  # plugin is already `hostNetwork: true`, so its `NEONFS_DIST_PORT` must
  # differ from anything else on the host.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# `CSIDriver` object characteristics. Refer to
# https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
# for semantics.
csiDriver:
  # Block volumes are attached through the controller so a second node
  # cannot take a device the first still holds — the exclusion is a
  # cluster-side claim rather than the CO's bookkeeping alone. Turning this
  # off skips ControllerPublishVolume entirely, and with it that guarantee.
  attachRequired: true
  podInfoOnMount: true
  # `Persistent` is the right answer for filesystem volumes;
  # `Ephemeral` would mean kubelet creates and tears them down inline
  # — not the NeonFS model.
  volumeLifecycleModes:
    - Persistent
  fsGroupPolicy: File
  storageCapacity: false
  seLinuxMount: false

# StorageClass installed alongside the chart. Set
# `storageClass.create: false` to manage StorageClass objects out of
# band.
storageClass:
  create: true
  name: neonfs
  isDefault: false
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    replication_factor: "3"
    tier: hot
  mountOptions: []

# RBAC.
rbac:
  create: true

serviceAccount:
  create: true
  controllerName: ""
  nodeName: ""
  annotations: {}
