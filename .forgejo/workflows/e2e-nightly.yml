name: Nightly end-to-end

# End-to-end jobs that need a whole runner to themselves: a Kubernetes
# cluster, a container daemon, and minutes of boot before the first
# assertion. They deliberately do **not** run per push.
#
# There are two amd64 runners and the integration suite already shards one
# job onto each. A job that boots Kubernetes alongside them exhausts both —
# four integration shards on two runners once filled the disk and the
# ephemeral port range, which is why the shard count matches the runner
# count exactly. So this runs on a schedule and on demand, is not wired into
# `canary`, and a failure here is a signal to investigate rather than a
# merge blocker.
#
# What these jobs prove today:
#
#   * `rig_acceptance` — the whole `test-rig` acceptance matrix against a real
#     cluster of QEMU VMs installed from the shipped `.deb`s, including the
#     steps that need a kernel of their own: attaching a block device over
#     NBD and verifying it with `fio --verify`. Those run inside the guests,
#     which is why the job itself can be an ordinary container given
#     /dev/kvm.
#   * `csi_tooling` — the Kubernetes toolchain at its pinned versions, and the
#     CSI chart as far as it can be validated *without* a cluster. It boots
#     none; neither kind nor k3d can bring one up inside a runner container,
#     which is what the k3s rig VM exists to answer.
#   * `cifs_smbd` — an `smbd` running the VFS module built against its own
#     Samba, and an SMB round trip through the bridge.
#
# `rig_acceptance` and `csi_tooling` are two halves of one story: the cluster
# the CSI end-to-end test needs comes from the rig, not from a runner
# container.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  # The versioned toolchain image the Samba build needs. Same shape as the
  # cache-warm workflow: a container image cannot be computed inside the job
  # that runs in it.
  setup:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: harton.dev/james/workflows/ci-base:latest
    outputs:
      elixir_rust_image: ${{ steps.parse.outputs.elixir_rust_image }}
      # The bare versions as well as the image name: the `cifs_smbd` job's
      # build cache key has to match the one `ci.yml`'s `neonfs_integration`
      # job writes, and that key is built from these rather than the image.
      elixir: ${{ steps.parse.outputs.elixir }}
      rust: ${{ steps.parse.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - id: parse
        run: |
          ELIXIR=$(awk '/^elixir/ {print $2}' .tool-versions)
          ERLANG=$(awk '/^erlang/ {print $2}' .tool-versions)
          RUST=$(awk '/^rust/ {print $2}' .tool-versions)
          echo "elixir_rust_image=harton.dev/james/workflows/elixir-rust:${ELIXIR}-erlang-${ERLANG}-rust-${RUST}" >> "$GITHUB_OUTPUT"
          echo "elixir=${ELIXIR}" >> "$GITHUB_OUTPUT"
          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"

  # =======================================================================
  # The `test-rig` acceptance matrix, in CI for the first time. Everything
  # here was previously only ever run by hand.
  #
  # It runs on `jeb` rather than the `amd64` pool for one reason: the rig
  # boots QEMU VMs and wants /dev/kvm, and TCG emulation is roughly ten times
  # slower. `runs-on: jeb` names the amd64 host that has that device — not a
  # bare-metal runner. Every label this instance offers resolves to a
  # container, `jeb` included, so the job passes the device through with
  # `--privileged --device /dev/kvm`, the same mechanism `ci.yml` already
  # uses for /dev/fuse and for loop devices.
  #
  # A container is sufficient because the suite's kernel-level steps are
  # guest operations, not host ones: `s_block_fio_verify` attaches the NBD
  # device and runs `fio` over ssh inside a VM. The host side wants only
  # QEMU, `cloud-localds` and ssh, on user-mode networking.
  #
  # Two scheduled QEMU workloads now share this one KVM host: `bench.yml` at
  # 03:00 Monday and this at 14:00 daily. They do not overlap today, and that
  # is now a constraint to preserve rather than a coincidence — anything that
  # lengthens either schedule has to account for the other.
  # =======================================================================
  rig_acceptance:
    needs: setup
    runs-on: jeb
    # Three VMs to boot and provision from freshly-built `.deb`s, then every
    # interface in the matrix. The rig is sequential by design, so give it
    # room; `bench.yml` allows 720 minutes for the same host.
    timeout-minutes: 240
    container:
      # Carries the Elixir and Rust toolchain the `.deb` build needs, so
      # nothing is provisioned in-job beyond QEMU itself.
      image: ${{ needs.setup.outputs.elixir_rust_image }}
      options: --privileged --device /dev/kvm

    steps:
      - uses: actions/checkout@v7

      # The CI base images live in another repository and carry no QEMU, so
      # this much is provisioned in-job. Same list as bench.yml, which boots
      # the same VMs. No `sudo`: the container runs as root.
      - name: Install rig prerequisites
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils jq
          if ! command -v nfpm >/dev/null 2>&1; then
            curl -fsSL -o /tmp/nfpm.tgz \
              https://github.com/goreleaser/nfpm/releases/download/v2.46.3/nfpm_2.46.3_Linux_x86_64.tar.gz
            tar -C /usr/local/bin -xzf /tmp/nfpm.tgz nfpm
          fi

      # `require_tools` only warns about a missing /dev/kvm and falls through
      # to TCG, which is ~10x slower — this job would not fail, it would time
      # out at 240 minutes without saying why. Fail here instead, naming the
      # device, so a runner that stops passing it through is legible.
      - name: Require /dev/kvm
        run: |
          if [ ! -w /dev/kvm ]; then
            echo "/dev/kvm is not present or not writable in this container." >&2
            echo "The job's container needs --device /dev/kvm; TCG fallback would time out." >&2
            exit 1
          fi

      # The image carries Elixir and Rust, so nothing installs a toolchain
      # here — but hex and rebar are per-user and `neonfs-rig up` builds the
      # `.deb`s from a mix release.
      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # A stale rig from an interrupted earlier run would be adopted as "a
      # running cluster" by `up`, so start from nothing rather than
      # inheriting whatever is on the host.
      - name: Discard any leftover rig state
        run: cd test-rig && ./neonfs-rig clean || true

      - name: Boot a three-node cluster
        run: |
          export PATH="$PWD/resources/scripts:$PATH"
          cd test-rig
          NODES=3 ./neonfs-rig up

      # `multi` is the fuller matrix: it adds the cross-node replication steps
      # to everything `single` runs. The whole suite runs, with no step
      # selection and no opt-in flag — an opt-in test is one nobody runs,
      # which is what kept the rig out of CI until now. Steps that cannot run
      # on this host report 77 (skip) through the suite's own contract rather
      # than failing, which is how the CIFS steps behave here: the VFS module
      # is not built (that needs a Samba tree, which is `cifs_smbd`'s job), so
      # its share step skips.
      #
      # Step ordering inside the suite is load-bearing and must not be
      # disturbed: `s_block_fio_verify` writes random data across the device
      # including its superblock, so it runs before the filesystem step. A
      # reordering destroys that step's fixture and surfaces as a failure in
      # the wrong place.
      - name: Run the acceptance matrix
        run: |
          export PATH="$PWD/resources/scripts:$PATH"
          cd test-rig
          ./acceptance multi 3

      # A nightly failure has to be diagnosable without shell access to
      # `jeb`, and the per-VM serial console is where a node that never came
      # up says why. Collected before teardown, which deletes the run dir.
      - name: Collect VM serial logs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rig-logs"
          for log in test-rig/.cache/run/node-*/serial.log; do
            [ -f "$log" ] || continue
            node="$(basename "$(dirname "$log")")"
            cp "$log" "$GITHUB_WORKSPACE/rig-logs/${node}-serial.log"
          done
          echo "collected $(ls -1 "$GITHUB_WORKSPACE/rig-logs" | wc -l) serial log(s)"

      - name: Upload rig logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rig-acceptance-${{ github.sha }}
          path: rig-logs/**
          retention-days: 14
          if-no-files-found: warn

      # Unconditional: VMs left running on a shared KVM host would collide
      # with the weekly bench and with the next night's run.
      - name: Tear down the rig
        if: always()
        run: cd test-rig && ./neonfs-rig clean || true

  csi_tooling:
    runs-on: amd64
    timeout-minutes: 60
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve csi-sanity version
        id: csi-sanity-version
        run: |
          version=$(resources/scripts/ci-install-k8s-tools --print-version csi-sanity)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache csi-sanity
        id: cache-csi-sanity
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/csi-sanity
          # Same key as the `neonfs_csi` package job in ci.yml, so whichever
          # runs first warms the other.
          key: csi-sanity-v${{ steps.csi-sanity-version.outputs.version }}-${{ runner.arch }}

      - name: Install kind, k3d, kubectl and helm
        run: resources/scripts/ci-install-k8s-tools kind k3d kubectl helm

      - name: Build csi-sanity
        if: steps.cache-csi-sanity.outputs.cache-hit != 'true'
        run: resources/scripts/ci-install-k8s-tools csi-sanity

      # No cluster is booted here, and that is a finding rather than an
      # omission: neither kind nor k3d can bring one up inside this job's own
      # Docker daemon. A kind node's systemd never reaches multi-user
      # ("could not find a log line that matches … Multi-User System"), and a
      # k3s server never reports ready inside ten minutes. Both were measured
      # here, not assumed. Booting a cluster needs infrastructure this runner
      # pool does not have, which is a capacity call rather than a config
      # tweak.
      #
      # So this validates what it can without one. `helm template` renders
      # every manifest the chart produces and fails on a template error;
      # `helm lint` checks the chart's own structure. Server-side validation
      # and the conformance run wait on a cluster.
      - name: Validate the CSI chart
        run: |
          helm lint deploy/charts/neonfs-csi
          helm template neonfs-csi deploy/charts/neonfs-csi \
            --namespace neonfs-csi \
            --set bootstrap.value=nightly-e2e-token \
            > /tmp/neonfs-csi-rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/neonfs-csi-rendered.yaml) manifests"

      - name: Report the toolchain
        run: |
          kind --version
          k3d version
          kubectl version --client
          helm version --short
          csi-sanity --version 2>/dev/null || echo "csi-sanity present (reports no version)"

  # =======================================================================
  # The Samba side of the same problem. The VFS module cannot be built
  # out-of-tree: it must ABI-match the smbd that loads it and carry the
  # distro's private-symbol version node, or smbd refuses it and a client
  # sees a bare connection error. So the sidecar is not a separate image
  # with its own Samba — it is this job's own container, which is where the
  # module was just built, and the module package's exact-version
  # `Depends: samba (= …)` makes apt enforce that rather than the comment.
  # =======================================================================
  cifs_smbd:
    needs: setup
    runs-on: amd64
    # The module builds inside the distro's Samba source. A warm
    # `.samba-build` cache relinks in minutes; a cold one pays the full
    # Samba build, which is what the vfs_neonfs job's own 120 minutes are
    # for.
    timeout-minutes: 150
    container:
      # The same image the vfs_neonfs job builds in: build-vfs-deb.sh links
      # the module against this Erlang's `ei`, and the deb it produces
      # pins the Samba this image's archive offers.
      image: ${{ needs.setup.outputs.elixir_rust_image }}
    steps:
      - uses: actions/checkout@v7

      # The cache holds a Samba *source tree*, and `build-vfs-deb.sh` refuses
      # to build against one that no longer matches the archive — so the key
      # has to move with the archive. A static key cannot: `actions/cache`
      # will not overwrite an existing entry, so the first point release after
      # it was written poisons it permanently and every later run restores
      # half a gigabyte it must then throw away.
      - name: Resolve the distro samba version
        id: samba
        run: |
          apt-get update -qq
          version=$(apt-cache policy samba | awk '/Candidate:/ {print $2}')
          if [ -z "$version" ] || [ "$version" = "(none)" ]; then
            echo "no samba candidate in this image's archive" >&2
            exit 1
          fi
          echo "version=$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Restore Samba build cache
        uses: actions/cache@v6
        with:
          path: .samba-build
          # The same key the vfs_neonfs job and the cache-warm workflow use,
          # so this shares their tree instead of building a third copy.
          key: v5-vfs_neonfs-samba-deb-${{ runner.arch }}-${{ steps.samba.outputs.version }}

      - name: Build samba-vfs-neonfs.deb
        run: OUT_DIR="$PWD/dist" bash packaging/build-vfs-deb.sh

      - name: Verify an smbd loads the module
        run: bash packaging/verify-smbd-sidecar.sh

      # The sidecar check leaves Samba and the module installed together,
      # which is exactly what the end-to-end test's capability gate looks
      # for — so this step needs no Samba setup of its own, only Elixir.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            neonfs_client/deps
            neonfs_client/_build
            neonfs_client/native/neonfs_chunker/target
            neonfs_client/priv/native
            neonfs_integration/deps
            neonfs_integration/_build
            neonfs_core/target
            neonfs_core/priv/native
            neonfs-cli/target
          # The same key the `neonfs_integration` job writes, so this
          # restores that build rather than paying for a third one. The
          # nightly job only ever reads it — `actions/cache` will not
          # overwrite an existing entry anyway.
          key: v7-build-neonfs_integration-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-${{ hashFiles('neonfs_integration/mix.lock', 'neonfs_core/Cargo.lock', 'neonfs_client/native/neonfs_chunker/Cargo.lock', 'neonfs-cli/Cargo.lock') }}
          restore-keys: v7-build-neonfs_integration-${{ runner.arch }}-

      - name: Build the integration suite
        working-directory: neonfs_integration
        run: |
          bash ../resources/scripts/ci-scrub-path-deps
          mix local.hex --force && mix local.rebar --force
          for attempt in 1 2 3; do
            mix deps.get && break
            [ "$attempt" = 3 ] && exit 1
            echo "mix deps.get failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          mix deps.compile
          mix compile

      - name: SMB end-to-end round trip
        working-directory: neonfs_integration
        run: mix test --include requires_smbd test/integration/cifs_smbd_test.exs
