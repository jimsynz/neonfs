name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  # Cap the BEAM port table size. Docker 25+ containers inherit an
  # enormous RLIMIT_NOFILE (~1e9), which OTP uses to size the port table
  # and allocates ~1.6 GB per VM before user code runs.
  ERL_ZFLAGS: "+Q 65536"

jobs:
  # ==========================================================================
  # Resolve tool versions from .tool-versions (so all jobs use the same
  # images) and compute which jobs this change needs: the package matrix is
  # .forgejo/ci-matrix.json filtered by resources/scripts/ci-affected
  # against the PR's changed files (pushes to main always run everything).
  #
  # Matrix entry schema (JSON has no comments, so it's documented here):
  #   name         package directory, also the job display name
  #   apt          optional extra apt packages to install first
  #   dind         optional; true starts a Docker daemon for e2e tests
  #   csi_sanity   optional; true installs the csi-sanity conformance binary
  #   cache_paths  newline-separated actions/cache paths (own artefacts plus
  #                any sibling path-dep artefacts the build compiles)
  #   lockfiles    space-separated lockfiles hashed into the cache key; every
  #                listed file must exist (the job fails on a missing one, so
  #                stale entries can't silently degrade the key)
  #
  # Only the package *names* travel through the matrix (keeping job names
  # readable); each job reads the rest of its entry from the checked-out
  # table. Container options can't be read in-job, so the two privileged
  # packages are special-cased on the package job's container.
  # ==========================================================================
  setup:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: harton.dev/james/workflows/ci-base:latest
    outputs:
      elixir: ${{ steps.parse.outputs.elixir }}
      erlang: ${{ steps.parse.outputs.erlang }}
      rust: ${{ steps.parse.outputs.rust }}
      elixir_image: ${{ steps.parse.outputs.elixir_image }}
      elixir_rust_image: ${{ steps.parse.outputs.elixir_rust_image }}
      rust_image: ${{ steps.parse.outputs.rust_image }}
      packages: ${{ steps.affected.outputs.packages }}
      package_matrix: ${{ steps.affected.outputs.package_matrix }}
      run_integration: ${{ steps.affected.outputs.run_integration }}
      run_cli: ${{ steps.affected.outputs.run_cli }}
      run_wire: ${{ steps.affected.outputs.run_wire }}
      run_vfs: ${{ steps.affected.outputs.run_vfs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ci-affected diffs against the PR base, which needs history.
          fetch-depth: 0
      - id: parse
        run: |
          ELIXIR=$(awk '/^elixir/ {print $2}' .tool-versions)
          ERLANG=$(awk '/^erlang/ {print $2}' .tool-versions)
          RUST=$(awk '/^rust/ {print $2}' .tool-versions)
          echo "elixir=${ELIXIR}" >> "$GITHUB_OUTPUT"
          echo "erlang=${ERLANG}" >> "$GITHUB_OUTPUT"
          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"
          echo "elixir_image=harton.dev/james/workflows/elixir:${ELIXIR}-erlang-${ERLANG}" >> "$GITHUB_OUTPUT"
          echo "elixir_rust_image=harton.dev/james/workflows/elixir-rust:${ELIXIR}-erlang-${ERLANG}-rust-${RUST}" >> "$GITHUB_OUTPUT"
          echo "rust_image=harton.dev/james/workflows/rust:${RUST}" >> "$GITHUB_OUTPUT"
      - id: affected
        run: |
          # Outside the checkout, so nothing downstream sees a stray file.
          AFFECTED="$(mktemp)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${BASE}...HEAD" \
              | tee /dev/stderr \
              | resources/scripts/ci-affected > "$AFFECTED"
          else
            resources/scripts/ci-affected --all > "$AFFECTED"
          fi
          cat "$AFFECTED" >> "$GITHUB_OUTPUT"

          # The `package` matrix must never expand to zero instances.
          # Forgejo instantiates a job with a false `if` (see vfs_neonfs)
          # and that skipped job satisfies `needs`, but a matrix over an
          # empty list creates *no job at all* — so `needs: package`
          # becomes unsatisfiable and `canary` sits at "Blocked by
          # required conditions" forever, which is exactly what a
          # `neonfs-cli`-only or docs-only change hit (#1641).
          #
          # Feed the matrix a single placeholder in that case. `package`
          # keeps its own `if` on the real `packages` output, so the
          # placeholder job is created and immediately skipped; it never
          # builds anything.
          PACKAGES=$(sed -n 's/^packages=//p' "$AFFECTED")
          if [ "$PACKAGES" = "[]" ]; then
            echo 'package_matrix=["none"]' >> "$GITHUB_OUTPUT"
          else
            echo "package_matrix=${PACKAGES}" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # buffering-check - Guard against whole-file buffering regressions (#254)
  # =========================================================================
  buffering-check:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for whole-file buffering patterns
        run: bash scripts/check_buffering.sh

  # =========================================================================
  # package - one job per entry in .forgejo/ci-matrix.json. The standard
  # shape is cache → build → mix check; the optional steps (apt packages,
  # dind, csi-sanity) are switched on per-entry by matrix fields.
  # =========================================================================
  package:
    needs: setup
    if: needs.setup.outputs.packages != '[]'
    runs-on: docker
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Never `packages` directly — an empty matrix creates no job and
        # deadlocks `canary` (#1641). `package_matrix` is the same list
        # with a placeholder substituted when it would be empty, and the
        # `if` above skips the job in exactly that case.
        pkg: ${{ fromJSON(needs.setup.outputs.package_matrix) }}
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
      # Container options can't be loaded from the table in-job, so the
      # privileged packages are special-cased here: neonfs_fuse mounts
      # /dev/fuse for real mounts, neonfs_docker runs dind.
      options: ${{ matrix.pkg == 'neonfs_fuse' && '--privileged --device /dev/fuse' || (matrix.pkg == 'neonfs_docker' && '--privileged') || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Load ci-matrix.json entry
        id: meta
        run: |
          entry=$(jq -c --arg name "${{ matrix.pkg }}" '.[] | select(.name == $name)' .forgejo/ci-matrix.json)
          if [ -z "$entry" ]; then
            echo "no ci-matrix.json entry for ${{ matrix.pkg }}" >&2
            exit 1
          fi
          {
            echo "apt=$(jq -r '.apt // ""' <<<"$entry")"
            echo "dind=$(jq -r '.dind // false' <<<"$entry")"
            echo "csi_sanity=$(jq -r '.csi_sanity // false' <<<"$entry")"
            echo "lockfiles=$(jq -r '.lockfiles' <<<"$entry")"
            echo 'cache_paths<<NEONFS_CACHE_PATHS'
            jq -r '.cache_paths' <<<"$entry"
            echo 'NEONFS_CACHE_PATHS'
          } >> "$GITHUB_OUTPUT"

      # Package-specific system deps, e.g. libfuse3 for the FUSE NIF
      # (wick), build-essential for neonfs_cifs's wire_probe (#1400), the
      # Docker daemon for the VolumeDriver e2e (#312 — note Debian Trixie
      # ships the CLI in a separate `docker-cli` package, which
      # --no-install-recommends won't pull in implicitly).
      - name: Install extra system packages
        if: steps.meta.outputs.apt != ''
        run: apt-get update && apt-get install -y --no-install-recommends ${{ steps.meta.outputs.apt }} && rm -rf /var/lib/apt/lists/*

      - name: Hash lockfiles
        id: lockhash
        run: |
          for f in ${{ steps.meta.outputs.lockfiles }}; do
            if [ ! -f "$f" ]; then
              echo "ci-matrix.json lists a lockfile that does not exist: $f" >&2
              exit 1
            fi
          done
          echo "hash=$(cat ${{ steps.meta.outputs.lockfiles }} | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.meta.outputs.cache_paths }}
          key: v6-build-${{ matrix.pkg }}-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-${{ steps.lockhash.outputs.hash }}
          restore-keys: v6-build-${{ matrix.pkg }}-${{ runner.arch }}-

      - name: Build
        working-directory: ${{ matrix.pkg }}
        run: |
          bash ../resources/scripts/ci-scrub-path-deps
          mix local.hex --force && mix local.rebar --force
          # A transient hex registry timeout shouldn't fail the job.
          for attempt in 1 2 3; do
            mix deps.get && break
            [ "$attempt" = 3 ] && exit 1
            echo "mix deps.get failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          mix deps.compile
          if grep -qs dialyxir mix.exs; then mix dialyzer --plt --force-check; fi

      # csi-sanity is the upstream CSI conformance suite (built from
      # source with Go). When it's on PATH the neonfs_csi test suite
      # picks up the `:requires_csi_sanity` conformance test; otherwise
      # that test is excluded. Cache the built binary across runs.
      - name: Cache csi-sanity
        if: steps.meta.outputs.csi_sanity == 'true'
        id: cache-csi-sanity
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/csi-sanity
          key: csi-sanity-v5.4.0-${{ runner.arch }}

      - name: Build csi-sanity
        if: steps.meta.outputs.csi_sanity == 'true' && steps.cache-csi-sanity.outputs.cache-hit != 'true'
        run: |
          GO_VERSION=1.23.6
          ARCH=$(dpkg --print-architecture)
          curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" | tar -C /usr/local -xz
          GOBIN=/usr/local/bin /usr/local/go/bin/go install \
            github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.4.0

      - name: Start Docker daemon (dind for the VolumeDriver e2e test, #312)
        if: steps.meta.outputs.dind == 'true'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          dockerd --host=unix:///var/run/docker.sock \
            --storage-driver=vfs \
            --iptables=false --ip-masq=false --bridge=none \
            >/tmp/dockerd.log 2>&1 &
          # Poll the daemon's HTTP `/_ping` endpoint directly via curl
          # over the unix socket. `docker info` was intermittently
          # unreliable here — it inherits ambient DOCKER_HOST / config
          # state and can hang for its full API timeout. `/_ping` is
          # the cheapest health check and gives an immediate answer.
          for i in $(seq 1 60); do
            if [ -S /var/run/docker.sock ] && \
               curl -fsS --max-time 2 --unix-socket /var/run/docker.sock \
                    http://localhost/_ping >/dev/null 2>&1; then
              echo "Docker daemon ready after ${i}s"
              docker version
              exit 0
            fi
            sleep 1
          done
          echo "Docker daemon failed to start. Tail of log:"
          tail -100 /tmp/dockerd.log
          echo ""
          echo "Last docker info attempt output:"
          docker info 2>&1 || true
          exit 1

      - name: Pre-pull e2e test images
        if: steps.meta.outputs.dind == 'true'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          # The VolumeDriver e2e test runs `docker run … alpine …`, which
          # pulls `alpine:latest` from Docker Hub on demand. A transient
          # registry network error there surfaced as a confusing test
          # failure on unrelated PRs (#1128). Pull the image up front with
          # backoff so any Docker Hub hiccup is retried — and reported here
          # as an environmental step failure — rather than flaking the test.
          # The test then finds the image locally and does not pull at runtime.
          for i in $(seq 1 5); do
            if docker pull alpine:latest; then
              echo "Pulled alpine:latest"
              exit 0
            fi
            echo "alpine:latest pull attempt ${i} failed; retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "Failed to pull alpine:latest after 5 attempts"
          exit 1

      - name: Check
        working-directory: ${{ matrix.pkg }}
        run: mix check

  # =========================================================================
  # vfs_neonfs_wire - C client of the neonfs_cifs ETF protocol (#1169). Builds
  # the wire client + mock-responder harness; needs only a C toolchain and the
  # erl_interface (ei) headers from the Erlang install, not Samba.
  # =========================================================================
  vfs_neonfs_wire:
    needs: setup
    if: needs.setup.outputs.run_wire == 'true'
    runs-on: docker
    timeout-minutes: 60
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
    steps:
      - name: Install C toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7
      - name: Build + run wire harness
        run: make -C neonfs_cifs/native/vfs_neonfs test

  # =========================================================================
  # vfs_neonfs - Samba VFS module (#1170). Builds the samba-vfs-neonfs .deb from
  # the distro's own samba source (VFS modules can't be built out-of-tree and
  # must ABI + symbol-version match the host smbd — #1548). The samba source +
  # build tree is cached, so only the first run pays the full Samba build; later
  # runs relink just the module and repackage. Kept a separate job so that cost
  # doesn't ride on every other suite. (Load/round-trip testing is #386.)
  # The vfs-cache-warm workflow rebuilds the cache on a schedule after
  # eviction; the raised timeout covers the cold-build case so it finishes
  # instead of flaking (#1565).
  # =========================================================================
  vfs_neonfs:
    needs: setup
    if: needs.setup.outputs.run_vfs == 'true'
    runs-on: docker
    timeout-minutes: 120
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Samba build cache
        uses: actions/cache@v6
        with:
          path: .samba-build
          # No cross-arch restore-keys fallback: the build tree is
          # architecture-specific (restoring an x64 tree onto arm64 fails
          # linking with "incompatible architecture"). Match the exact,
          # arch-qualified key only.
          key: v4-vfs_neonfs-samba-deb-${{ runner.arch }}
      - name: Build samba-vfs-neonfs.deb
        run: OUT_DIR="$(mktemp -d)" bash packaging/build-vfs-deb.sh

  # =========================================================================
  # neonfs-cli - Rust CLI
  # =========================================================================
  neonfs-cli:
    needs: setup
    if: needs.setup.outputs.run_cli == 'true'
    runs-on: docker
    timeout-minutes: 60
    container:
      image: ${{ needs.setup.outputs.rust_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            neonfs-cli/target
          key: v3-build-neonfs-cli-${{ runner.arch }}-${{ needs.setup.outputs.rust }}-${{ hashFiles('neonfs-cli/Cargo.lock') }}
          restore-keys: v3-build-neonfs-cli-${{ runner.arch }}-

      - name: Build
        working-directory: neonfs-cli
        run: |
          cargo fetch
          cargo test --no-run --release

      - name: Test
        working-directory: neonfs-cli
        run: cargo test --jobs 1 --release

      - name: Clippy
        working-directory: neonfs-cli
        run: cargo clippy --all-targets --all-features -- -D warnings

  # =========================================================================
  # neonfs_integration - Integration tests. Stays outside the package matrix:
  # it needs the amd64 runner pool, a registry service sidecar (which is
  # job-level and can't be switched per matrix entry), loop devices, and
  # containerd.
  # =========================================================================
  neonfs_integration:
    needs: setup
    if: needs.setup.outputs.run_integration == 'true'
    runs-on: amd64
    timeout-minutes: 60
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
      options: --privileged
    services:
      # Local registry for `containerd_image_pull_test.exs` (#728).
      # Pre-seeded by the "Pre-seed registry sidecar" step below
      # via `crane`, so the test never reaches docker.io. The test
      # and the pre-seed step both reach this sidecar at
      # `registry:5000` over the workflow's service network — the
      # host port is never used, so we don't map it. Mapping
      # `5000:5000` collides with anything else holding the host
      # port (stuck containers from previous jobs, a docker daemon
      # registry mirror, etc.) and breaks the whole job (#765).
      registry:
        image: registry:3
    steps:
      - name: Install loopback dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            e2fsprogs mount containerd skopeo
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            neonfs_client/deps
            neonfs_client/_build
            neonfs_client/native/neonfs_chunker/target
            neonfs_client/priv/native
            neonfs_integration/deps
            neonfs_integration/_build
            neonfs_core/target
            neonfs_core/priv/native
          key: v6-build-neonfs_integration-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-${{ hashFiles('neonfs_integration/mix.lock', 'neonfs_core/Cargo.lock', 'neonfs_client/native/neonfs_chunker/Cargo.lock') }}
          restore-keys: v6-build-neonfs_integration-${{ runner.arch }}-

      - name: Build
        working-directory: neonfs_integration
        run: |
          bash ../resources/scripts/ci-scrub-path-deps
          mix local.hex --force && mix local.rebar --force
          # A transient hex registry timeout shouldn't fail the job.
          for attempt in 1 2 3; do
            mix deps.get && break
            [ "$attempt" = 3 ] && exit 1
            echo "mix deps.get failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          mix deps.compile
          mix compile
          if grep -qs dialyxir mix.exs; then mix dialyzer --plt --force-check; fi

      - name: Enable loopback devices
        run: |
          modprobe loop max_loop=64 || true
          [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237
          for i in $(seq 0 63); do
            [ -e /dev/loop$i ] || mknod /dev/loop$i b 7 $i
          done

      - name: Containerd smoke test (#554 prep)
        working-directory: neonfs_integration
        run: mix test --include requires_containerd test/integration/containerd_smoke_test.exs

      - name: Pre-seed registry sidecar
        working-directory: neonfs_integration
        run: |
          # Push the committed OCI fixture into the `registry:2`
          # sidecar so `containerd_image_pull_test.exs` can pull
          # via `localhost:5000` without reaching docker.io.
          # `--dest-tls-verify=false` because the sidecar speaks
          # plain HTTP on the service network.
          skopeo copy \
            --dest-tls-verify=false \
            oci-archive:test/fixtures/test-image.tar \
            docker://registry:5000/neonfs-test-image:v1

      - name: Check
        working-directory: neonfs_integration
        run: mix check

  # =========================================================================
  # canary - single aggregation gate. Fails if any needed job failed or was
  # cancelled; succeeds when every job succeeded or was skipped (skipped is
  # allowed so path-filtered runs still pass). Branch protection can require
  # just this check.
  # =========================================================================
  canary:
    needs:
      - setup
      - buffering-check
      - package
      - vfs_neonfs_wire
      - vfs_neonfs
      - neonfs-cli
      - neonfs_integration
    if: always()
    runs-on: docker
    timeout-minutes: 10
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - name: Check all required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded (or were skipped)."
