name: CI

# The NeonFS packages each run their own CI from their own repos. This one runs
# the cross-node integration suite against the sibling versions
# `neonfs_integration/mix.exs` pins — the combination that ships — plus the
# static checks every NeonFS repo runs.

on:
  push:
    branches: [main]
  pull_request:
  # Forgejo has no rerun API; a dispatch is how a script re-runs CI without
  # pushing a commit.
  workflow_dispatch:

env:
  MIX_ENV: test
  # Cap the BEAM port table size. Docker 25+ containers inherit an
  # enormous RLIMIT_NOFILE (~1e9), which OTP uses to size the port table
  # and allocates ~1.6 GB per VM before user code runs.
  ERL_ZFLAGS: "+Q 65536"
  # Run `mix check`'s tools one at a time. Runners are concurrency-1, but
  # `mix check` parallelises itself, and a peer-cluster ex_unit suite
  # sharing a runner with dialyzer and cargo is enough to time out post-boot
  # Ra round trips. Read by every `.check.exs`; unset locally, so developer
  # runs stay parallel.
  NEONFS_CHECK_PARALLEL: "false"

jobs:
  # A `container:` key is evaluated before any step in its job, so the image
  # cannot be computed inside the job that names it.
  setup:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: harton.dev/james/workflows/ci-base:latest
    outputs:
      elixir: ${{ steps.parse.outputs.elixir }}
      rust: ${{ steps.parse.outputs.rust }}
      elixir_rust_image: ${{ steps.parse.outputs.elixir_rust_image }}
    steps:
      - uses: actions/checkout@v7
      # Cloned rather than checked out: actions/checkout authenticates with
      # this repo's job token, which cannot see another repo.
      - name: Fetch the workspace's CI scripts
        run: git clone --quiet --depth 1 https://harton.dev/project-neon/neonfs_workspace.git .neonfs_workspace
      - id: parse
        run: .neonfs_workspace/ci/toolchain-image >> "$GITHUB_OUTPUT"

  # Greps for shapes that compile but are wrong: whole-file buffering, and
  # Logger formatter misconfiguration.
  static-checks:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the workspace's CI scripts
        run: git clone --quiet --depth 1 https://harton.dev/project-neon/neonfs_workspace.git .neonfs_workspace
      - name: Check for whole-file buffering patterns
        run: bash .neonfs_workspace/ci/check-buffering
      - name: Check Logger formatter configuration
        run: bash .neonfs_workspace/ci/check-logger-formatter

  # The suite's static tools do not need the privileged container, the loop
  # devices or the registry sidecar, and they must not run once per shard.
  neonfs_integration_checks:
    needs: setup
    runs-on: amd64
    timeout-minutes: 30
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
    steps:
      - uses: actions/checkout@v7

      # Every sibling — its NIF build output and the CLI's included — lives
      # under deps/ and is pinned in mix.lock, so the lockfile alone keys it.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            neonfs_integration/deps
            neonfs_integration/_build
          key: v8-integration-checks-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-${{ hashFiles('neonfs_integration/mix.lock') }}
          restore-keys: v8-integration-checks-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-

      - name: Build
        working-directory: neonfs_integration
        run: |
          mix local.hex --force && mix local.rebar --force
          # A transient registry or git timeout shouldn't fail the job.
          for attempt in 1 2 3; do
            mix deps.get && break
            [ "$attempt" = 3 ] && exit 1
            echo "mix deps.get failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          mix deps.compile
          mix compile
          mix dialyzer --plt --force-check

      - name: Check
        working-directory: neonfs_integration
        run: mix check --except ex_unit

  neonfs_integration:
    needs: setup
    runs-on: amd64
    strategy:
      fail-fast: false
      matrix:
        # One shard per amd64 runner, and there are two. Going wider does not
        # add parallelism — the scheduler just puts two shards on one host,
        # where they share its disk and ephemeral port range while each boots
        # multi-node peer clusters. Four shards did exactly that and exhausted
        # both. Raise this only alongside the runner count, and keep
        # `--partitions` below in step with its length.
        partition: [1, 2]
    # Headroom over a shard's real cost, not an open-ended limit: a genuinely
    # wedged shard must still fail rather than sit indefinitely. The slower
    # shard runs ~40 minutes plus setup; Mix distributes test *files*, so the
    # split is approximate and the slower shard absorbs most of the growth.
    timeout-minutes: 60
    container:
      image: ${{ needs.setup.outputs.elixir_rust_image }}
      options: --privileged
    services:
      # Local registry for `containerd_image_pull_test.exs`, pre-seeded below
      # via `skopeo` so the test never reaches docker.io. Reached at
      # `registry:5000` over the service network; the host port is never used,
      # so it is not mapped — mapping it collides with anything else holding
      # the host port and breaks the whole job. Every shard gets one, because
      # the containerd tests can land in either.
      registry:
        image: registry:3
    steps:
      - name: Install loopback dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            e2fsprogs mount containerd skopeo
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            neonfs_integration/deps
            neonfs_integration/_build
          key: v8-integration-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-${{ hashFiles('neonfs_integration/mix.lock') }}
          restore-keys: v8-integration-${{ runner.arch }}-${{ needs.setup.outputs.elixir }}-${{ needs.setup.outputs.rust }}-

      - name: Build
        working-directory: neonfs_integration
        run: |
          mix local.hex --force && mix local.rebar --force
          # A transient registry or git timeout shouldn't fail the job.
          for attempt in 1 2 3; do
            mix deps.get && break
            [ "$attempt" = 3 ] && exit 1
            echo "mix deps.get failed (attempt ${attempt}); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          mix deps.compile
          mix compile

      - name: Enable loopback devices
        run: |
          modprobe loop max_loop=64 || true
          [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237
          for i in $(seq 0 63); do
            [ -e /dev/loop$i ] || mknod /dev/loop$i b 7 $i
          done

      - name: Containerd smoke test
        working-directory: neonfs_integration
        run: mix test --include requires_containerd test/integration/containerd_smoke_test.exs

      - name: Pre-seed registry sidecar
        working-directory: neonfs_integration
        run: |
          # `--dest-tls-verify=false` because the sidecar speaks plain HTTP on
          # the service network.
          skopeo copy \
            --dest-tls-verify=false \
            oci-archive:test/fixtures/test-image.tar \
            docker://registry:5000/neonfs-test-image:v1

      - name: Test (shard ${{ matrix.partition }} of 2)
        working-directory: neonfs_integration
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: mix test --partitions 2
