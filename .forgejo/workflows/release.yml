name: Release

# A `v*` tag — cut with `MIX_ENV=dev mix git_ops.release` in resources/release
# and pushed with `git push --follow-tags` — publishes `neonfs-common`: the
# shared configuration, TLS helper and system user every NeonFS service package
# depends on. The packages themselves publish from their own repos.

on:
  push:
    tags: ["v*"]
  # Re-runs a tag's publishing without moving the tag: dispatch on the tag ref.
  workflow_dispatch:

jobs:
  debs:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch }}
    timeout-minutes: 30
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - uses: actions/checkout@v7
      # Cloned rather than checked out: actions/checkout authenticates with
      # this repo's job token, which cannot see another repo.
      - name: Fetch the workspace's packaging scripts
        run: git clone --quiet --depth 1 https://harton.dev/project-neon/neonfs_workspace.git .neonfs_workspace

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gettext-base
          rm -rf /var/lib/apt/lists/*
          # renovate: datasource=github-releases depName=goreleaser/nfpm
          NFPM_VERSION=v2.47.0
          case "$(dpkg --print-architecture)" in
            amd64) nfpm_arch=x86_64 ;;
            arm64) nfpm_arch=arm64 ;;
          esac
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_${nfpm_arch}.tar.gz" \
            | tar xz -C /usr/local/bin nfpm

      - name: Package
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export ARCH="$(dpkg --print-architecture)"
          export BUILD_DIR="$PWD"
          export COMMON="$PWD/.neonfs_workspace/packaging"
          mkdir -p dist
          for config in packaging/nfpm/*.yaml; do
            generated="$(mktemp --suffix=.yaml -p packaging/nfpm)"
            envsubst < "$config" > "$generated"
            nfpm package --config "$generated" --packager deb --target dist/
            rm -f "$generated"
          done

      - name: Upload to the Debian repository
        run: |
          response=$(mktemp)
          for deb in dist/*.deb; do
            status=$(curl -sS -o "$response" -w '%{http_code}' \
              -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
              --upload-file "$deb" \
              "${GITHUB_SERVER_URL}/api/packages/project-neon/debian/pool/trixie/main/upload")
            case "$status" in
              2??) echo "uploaded $(basename "$deb")" ;;
              409)
                grep -qx 'package file already exists' "$response" || { cat "$response" >&2; exit 1; }
                echo "$(basename "$deb") is already published"
                ;;
              *) cat "$response" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.arch }}
          path: dist/*.deb

  release:
    needs: debs
    runs-on: docker
    timeout-minutes: 30
    container:
      image: harton.dev/james/workflows/ci-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/

      # The job's own token: REGISTRY_TOKEN is scoped for packages and cannot
      # create releases.
      - name: Create or update the Forgejo release
        env:
          TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"

          # git_ops writes `## [v1.2.3](compare-link) (date)` headings.
          notes=$(awk -v v="$tag" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }' CHANGELOG.md 2>/dev/null || true)
          [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ] || notes="No changelog entries for ${tag}."

          # A re-run of the tag must not create a second release.
          id=$(curl -sf -H "Authorization: token ${TOKEN}" "${api}/tags/${tag}" | jq -r '.id // empty' || true)
          payload=$(jq -n --arg tag "$tag" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}')
          if [ -n "$id" ]; then
            curl -sS --fail-with-body -X PATCH -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
              -d "$payload" "${api}/${id}" > /dev/null
          else
            id=$(curl -sS --fail-with-body -X POST -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
              -d "$payload" "${api}" | jq -r '.id')
          fi

          existing=$(curl -sS --fail-with-body -H "Authorization: token ${TOKEN}" "${api}/${id}/assets" | jq -r '.[].name')
          for file in artifacts/*/*.deb; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            printf '%s\n' "$existing" | grep -qxF "$name" && continue
            curl -sS --fail-with-body -X POST -H "Authorization: token ${TOKEN}" \
              "${api}/${id}/assets?name=$(jq -rn --arg n "$name" '$n | @uri')" \
              -F "attachment=@${file}" > /dev/null
            echo "attached ${name}"
          done
