name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Resolve tool and release versions once so every artifact uses the same
  # package version and workflows CI images.
  # =========================================================================
  resolve-versions:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: harton.dev/james/workflows/ci-base:latest
    outputs:
      elixir: ${{ steps.parse.outputs.elixir }}
      erlang: ${{ steps.parse.outputs.erlang }}
      rust: ${{ steps.parse.outputs.rust }}
      elixir_rust_image: ${{ steps.parse.outputs.elixir_rust_image }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
      - id: parse
        run: |
          ELIXIR=$(awk '/^elixir/ {print $2}' .tool-versions)
          ERLANG=$(awk '/^erlang/ {print $2}' .tool-versions)
          RUST=$(awk '/^rust/ {print $2}' .tool-versions)
          RELEASE_VERSION=$(awk -F'"' '/@version/ {print $2; exit}' resources/release/mix.exs)

          if [ -z "$RELEASE_VERSION" ]; then
            echo "could not resolve the release version" >&2
            exit 1
          fi

          case "$GITHUB_REF" in
            refs/tags/v*)
              REF_VERSION=${GITHUB_REF_NAME#v}
              if [ "$REF_VERSION" != "$RELEASE_VERSION" ]; then
                echo "tag version ${REF_VERSION} does not match package version ${RELEASE_VERSION}" >&2
                exit 1
              fi
              ;;
          esac

          echo "elixir=${ELIXIR}" >> "$GITHUB_OUTPUT"
          echo "erlang=${ERLANG}" >> "$GITHUB_OUTPUT"
          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"
          echo "elixir_rust_image=harton.dev/james/workflows/elixir-rust:${ELIXIR}-erlang-${ERLANG}-rust-${RUST}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  containers:
    needs: resolve-versions
    runs-on: ${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        target: [base, cli, core, fuse, nfs, s3, webdav, docker, csi, containerd, cifs, block, omnibus]
    container:
      image: docker:29-dind
      options: --privileged

    steps:
      - name: Install checkout dependencies
        run: apk add --no-cache nodejs git

      - uses: actions/checkout@v7

      - name: Start Docker daemon
        run: |
          dockerd --host=unix:///var/run/docker.sock --insecure-registry=forgejo.dmz &
          timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login --username=james --password-stdin forgejo.dmz

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login --username=jimsynz --password-stdin ghcr.io

      - name: Set up Docker Buildx
        run: |
          cat > /tmp/buildkitd.toml << 'TOML'
          [registry."forgejo.dmz"]
            http = true
            insecure = true
          TOML
          docker buildx create --name builder --config /tmp/buildkitd.toml --driver-opt network=host
          docker buildx use builder

      - name: Build target
        run: |
          TAG=${{ needs.resolve-versions.outputs.release_version }}-${{ matrix.arch }}
          PLATFORMS=linux/${{ matrix.arch }} TAG=$TAG ./containers/bake.sh --pull --load "${{ matrix.target }}"

      - name: Push target
        run: |
          TAG=${{ needs.resolve-versions.outputs.release_version }}-${{ matrix.arch }}
          if [ "${{ matrix.target }}" != base ]; then
            docker push "forgejo.dmz/project-neon/neonfs/${{ matrix.target }}:${TAG}"
            docker push "ghcr.io/jimsynz/neonfs/${{ matrix.target }}:${TAG}"
          fi

  containers-manifest:
    runs-on: amd64
    timeout-minutes: 60
    needs: [resolve-versions, containers]
    container:
      image: docker:29-dind
      options: --privileged

    steps:
      - name: Start Docker daemon
        run: |
          dockerd --host=unix:///var/run/docker.sock --insecure-registry=forgejo.dmz &
          timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login --username=james --password-stdin forgejo.dmz

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login --username=jimsynz --password-stdin ghcr.io

      - name: Set up Docker Buildx
        run: |
          cat > /tmp/buildkitd.toml << 'TOML'
          [registry."forgejo.dmz"]
            http = true
            insecure = true
          TOML
          docker buildx create --name builder --config /tmp/buildkitd.toml --driver-opt network=host
          docker buildx use builder

      - name: Create multi-arch manifests
        run: |
          VERSION=${{ needs.resolve-versions.outputs.release_version }}
          IMAGES="core fuse nfs s3 webdav docker csi containerd cifs block omnibus cli"

          for image in $IMAGES; do
            docker buildx imagetools create \
              -t forgejo.dmz/project-neon/neonfs/${image}:${VERSION} \
              forgejo.dmz/project-neon/neonfs/${image}:${VERSION}-amd64 \
              forgejo.dmz/project-neon/neonfs/${image}:${VERSION}-arm64

            docker buildx imagetools create \
              -t ghcr.io/jimsynz/neonfs/${image}:${VERSION} \
              ghcr.io/jimsynz/neonfs/${image}:${VERSION}-amd64 \
              ghcr.io/jimsynz/neonfs/${image}:${VERSION}-arm64

            docker buildx imagetools create \
              -t forgejo.dmz/project-neon/neonfs/${image}:latest \
              forgejo.dmz/project-neon/neonfs/${image}:${VERSION}-amd64 \
              forgejo.dmz/project-neon/neonfs/${image}:${VERSION}-arm64

            docker buildx imagetools create \
              -t ghcr.io/jimsynz/neonfs/${image}:latest \
              ghcr.io/jimsynz/neonfs/${image}:${VERSION}-amd64 \
              ghcr.io/jimsynz/neonfs/${image}:${VERSION}-arm64
          done

  # =========================================================================
  # Debian packages - Native multi-arch builds
  # Build each architecture on its own native runner, then upload to Forgejo.
  # =========================================================================
  debs-amd64:
    needs: resolve-versions
    runs-on: amd64
    timeout-minutes: 120
    container:
      image: ${{ needs.resolve-versions.outputs.elixir_rust_image }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libfuse3-dev gettext-base
          rm -rf /var/lib/apt/lists/*

      - name: Install nfpm
        run: |
          # renovate: datasource=github-releases depName=goreleaser/nfpm
          NFPM_VERSION=v2.47.0
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin nfpm

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          # `priv/native/` is where Rustler copies the freshly-built `.so`.
          # If we cache `_build/` without it, a partial cache restore can
          # leave the consumer's `_build/prod/lib/<dep>/.mix/compile.*`
          # marking the dep as compiled while the source `priv/native/.so`
          # is gone — `mix compile` then skips the rustler step and
          # `mix release` copies an empty `priv/` into the rel tree (#746).
          path: |
            neonfs-cli/target
            /usr/local/cargo/registry
            /usr/local/cargo/git
            neonfs_client/deps
            neonfs_client/_build
            neonfs_client/native/neonfs_chunker/target
            neonfs_client/priv/native
            neonfs_core/deps
            neonfs_core/_build
            neonfs_core/target
            neonfs_core/priv/native
            neonfs_fuse/deps
            neonfs_fuse/_build
            neonfs_fuse/target
            neonfs_fuse/priv/native
            neonfs_nfs/deps
            neonfs_nfs/_build
            neonfs_nfs/target
            neonfs_nfs/priv/native
            neonfs_s3/deps
            neonfs_s3/_build
            neonfs_webdav/deps
            neonfs_webdav/_build
            neonfs_docker/deps
            neonfs_docker/_build
            neonfs_containerd/deps
            neonfs_containerd/_build
            neonfs_cifs/deps
            neonfs_cifs/_build
            neonfs_omnibus/deps
            neonfs_omnibus/_build
            .samba-build
          key: v2-release-amd64-${{ needs.resolve-versions.outputs.elixir }}-${{ needs.resolve-versions.outputs.rust }}-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}
          restore-keys: v2-release-amd64-${{ needs.resolve-versions.outputs.elixir }}-${{ needs.resolve-versions.outputs.rust }}-

      - name: Build releases
        run: |
          mix local.hex --force && mix local.rebar --force

          # Build CLI
          cd neonfs-cli && cargo build --release && cd ..

          # Build Elixir releases.
          #
          # `mix release --overwrite` overwrites individual files but does
          # NOT delete pre-existing `lib/<app>-<old_vsn>/` directories.
          # With a restored cache, that means stale app-version dirs
          # accumulate, and in some cases the new `lib/<app>-<new_vsn>/priv/`
          # is left empty (which is how `neonfs_blob.so` ended up missing
          # from `neonfs_core-0.2.3/priv/native/` in the omnibus deb, #746).
          # Wipe `_build/prod/rel/` before every release.
          for component in neonfs_core neonfs_fuse neonfs_nfs neonfs_s3 neonfs_webdav neonfs_docker neonfs_containerd neonfs_cifs neonfs_omnibus; do
            cd "$component"
            mix deps.get --only prod
            MIX_ENV=prod mix compile
            rm -rf _build/prod/rel
            MIX_ENV=prod mix release --overwrite
            cd ..
          done

      - name: Package .deb files
        run: |
          VERSION=${{ needs.resolve-versions.outputs.release_version }}
          export VERSION ARCH=amd64 BUILD_DIR="$FORGEJO_WORKSPACE"
          mkdir -p dist

          # Build the samba-vfs-neonfs deb — the Samba VFS module, from the
          # distro's own samba source so it loads in the host smbd (#1548).
          # neonfs-cifs / neonfs-omnibus depend on it.
          OUT_DIR="$FORGEJO_WORKSPACE/dist" bash packaging/build-vfs-deb.sh

          cd packaging/nfpm
          for config in neonfs-cli neonfs-common neonfs-core neonfs-fuse neonfs-nfs neonfs-s3 neonfs-webdav neonfs-docker neonfs-containerd neonfs-cifs neonfs-omnibus; do
            envsubst < "${config}.yaml" > ".generated-${config}.yaml"
            nfpm package --config ".generated-${config}.yaml" --packager deb --target "$FORGEJO_WORKSPACE/dist/"
            rm -f ".generated-${config}.yaml"
          done

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v5
        with:
          name: debs-amd64
          path: dist/*.deb

  debs-arm64:
    needs: resolve-versions
    runs-on: arm64
    timeout-minutes: 120
    container:
      image: ${{ needs.resolve-versions.outputs.elixir_rust_image }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libfuse3-dev gettext-base
          rm -rf /var/lib/apt/lists/*

      - name: Install nfpm
        run: |
          # renovate: datasource=github-releases depName=goreleaser/nfpm
          NFPM_VERSION=v2.47.0
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_arm64.tar.gz" \
            | tar xz -C /usr/local/bin nfpm

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          # `priv/native/` is where Rustler copies the freshly-built `.so`.
          # If we cache `_build/` without it, a partial cache restore can
          # leave the consumer's `_build/prod/lib/<dep>/.mix/compile.*`
          # marking the dep as compiled while the source `priv/native/.so`
          # is gone — `mix compile` then skips the rustler step and
          # `mix release` copies an empty `priv/` into the rel tree (#746).
          path: |
            neonfs-cli/target
            /usr/local/cargo/registry
            /usr/local/cargo/git
            neonfs_client/deps
            neonfs_client/_build
            neonfs_client/native/neonfs_chunker/target
            neonfs_client/priv/native
            neonfs_core/deps
            neonfs_core/_build
            neonfs_core/target
            neonfs_core/priv/native
            neonfs_fuse/deps
            neonfs_fuse/_build
            neonfs_fuse/target
            neonfs_fuse/priv/native
            neonfs_nfs/deps
            neonfs_nfs/_build
            neonfs_nfs/target
            neonfs_nfs/priv/native
            neonfs_s3/deps
            neonfs_s3/_build
            neonfs_webdav/deps
            neonfs_webdav/_build
            neonfs_docker/deps
            neonfs_docker/_build
            neonfs_containerd/deps
            neonfs_containerd/_build
            neonfs_cifs/deps
            neonfs_cifs/_build
            neonfs_omnibus/deps
            neonfs_omnibus/_build
            .samba-build
          key: v2-release-arm64-${{ needs.resolve-versions.outputs.elixir }}-${{ needs.resolve-versions.outputs.rust }}-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}
          restore-keys: v2-release-arm64-${{ needs.resolve-versions.outputs.elixir }}-${{ needs.resolve-versions.outputs.rust }}-

      - name: Build releases
        run: |
          mix local.hex --force && mix local.rebar --force

          # Build CLI
          cd neonfs-cli && cargo build --release && cd ..

          # Build Elixir releases.
          #
          # `mix release --overwrite` overwrites individual files but does
          # NOT delete pre-existing `lib/<app>-<old_vsn>/` directories.
          # With a restored cache, that means stale app-version dirs
          # accumulate, and in some cases the new `lib/<app>-<new_vsn>/priv/`
          # is left empty (which is how `neonfs_blob.so` ended up missing
          # from `neonfs_core-0.2.3/priv/native/` in the omnibus deb, #746).
          # Wipe `_build/prod/rel/` before every release.
          for component in neonfs_core neonfs_fuse neonfs_nfs neonfs_s3 neonfs_webdav neonfs_docker neonfs_containerd neonfs_cifs neonfs_omnibus; do
            cd "$component"
            mix deps.get --only prod
            MIX_ENV=prod mix compile
            rm -rf _build/prod/rel
            MIX_ENV=prod mix release --overwrite
            cd ..
          done

      - name: Package .deb files
        run: |
          VERSION=${{ needs.resolve-versions.outputs.release_version }}
          export VERSION ARCH=arm64 BUILD_DIR="$FORGEJO_WORKSPACE"
          mkdir -p dist

          # Build the samba-vfs-neonfs deb — the Samba VFS module, from the
          # distro's own samba source so it loads in the host smbd (#1548).
          # neonfs-cifs / neonfs-omnibus depend on it.
          OUT_DIR="$FORGEJO_WORKSPACE/dist" bash packaging/build-vfs-deb.sh

          cd packaging/nfpm
          for config in neonfs-cli neonfs-common neonfs-core neonfs-fuse neonfs-nfs neonfs-s3 neonfs-webdav neonfs-docker neonfs-containerd neonfs-cifs neonfs-omnibus; do
            envsubst < "${config}.yaml" > ".generated-${config}.yaml"
            nfpm package --config ".generated-${config}.yaml" --packager deb --target "$FORGEJO_WORKSPACE/dist/"
            rm -f ".generated-${config}.yaml"
          done

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v5
        with:
          name: debs-arm64
          path: dist/*.deb

  debs-upload:
    runs-on: docker
    timeout-minutes: 60
    needs: [debs-amd64, debs-arm64]
    container:
      image: harton.dev/james/workflows/ci-base:latest

    steps:
      - name: Download amd64 .deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: debs-amd64
          path: dist/

      - name: Download arm64 .deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: debs-arm64
          path: dist/

      - name: Upload to Forgejo Debian repository
        run: |
          response=$(mktemp)
          for deb in dist/*.deb; do
            echo "Uploading $(basename "$deb")..."
            status=$(curl -sS -o "$response" -w '%{http_code}' \
              -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
              --upload-file "$deb" \
              "https://harton.dev/api/packages/project-neon/debian/pool/trixie/main/upload")

            case "$status" in
              2??) ;;
              409)
                if grep -qx 'package file already exists' "$response"; then
                  echo "$(basename "$deb") is already published; skipping."
                else
                  cat "$response" >&2
                  exit 1
                fi
                ;;
              *)
                cat "$response" >&2
                exit 1
                ;;
            esac
          done
          rm -f "$response"

  forgejo-release:
    runs-on: docker
    timeout-minutes: 60
    needs: [resolve-versions, containers-manifest, debs-upload]
    container:
      image: harton.dev/james/workflows/ci-base:latest

    steps:
      - uses: actions/checkout@v7

      - name: Download amd64 .deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: debs-amd64
          path: dist/

      - name: Download arm64 .deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: debs-arm64
          path: dist/

      - name: Extract changelog and create release
        run: |
          VERSION=${{ needs.resolve-versions.outputs.release_version }}
          RELEASE_TAG=v${VERSION}

          CHANGELOG=$(awk '/^## \['"$VERSION"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)

          # Create the release
          RELEASE_ID=$(curl -sf -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg name "$RELEASE_TAG" \
              --arg body "$CHANGELOG" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}'
            )" | jq -r '.id')

          # Attach .deb files as release assets
          for deb in dist/*.deb; do
            echo "Attaching $(basename "$deb") to release..."
            curl -sf \
              -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
              -X POST \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$(basename "$deb")" \
              -F "attachment=@${deb}" \
              > /dev/null
          done
