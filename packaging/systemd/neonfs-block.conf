# NeonFS block device (NBD) configuration
# Sourced by neonfs-block.service (in addition to /etc/neonfs/neonfs.conf).
# These are the block-specific knobs; shared cluster/node settings live in
# /etc/neonfs/neonfs.conf.

# Address the NBD server binds. Loopback by default: NBD has no
# authentication of its own, so anything that can reach this port can attach
# any export this node resolves. Widen it only onto a trusted network.
# NEONFS_BLOCK_BIND=0.0.0.0

# Port the NBD server listens on (10809 is the IANA-assigned NBD port).
# NEONFS_BLOCK_PORT=10809

# Node name for the block target (defaults to neonfs_block@$(hostname -f)).
# NEONFS_BLOCK_NODE=neonfs_block@block1.example.com

# --- Attaching a device -----------------------------------------------------
# An export names its backing file as <volume>:<path>, so a device created at
# /dev.img in volume "blockvol" is attached with:
#
#   nbd-client <host> 10809 /dev/nbd0 -name blockvol:/dev.img
#
# The backing file has to exist first — attaching does not create one.
